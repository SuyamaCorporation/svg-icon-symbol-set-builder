<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG アイコン シンボルセット ビルダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-center mb-2 text-sky-400">SVG アイコン シンボルセット ビルダー</h1>
    <p class="text-center text-gray-400 mb-8 text-sm">SVGパスを入力して&lt;symbol&gt;スプライトシートを生成・プレビュー</p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- 入力フォーム -->
      <div class="bg-zinc-800 rounded-xl p-6">
        <h2 class="text-lg font-semibold mb-4 text-sky-300">アイコンを追加</h2>
        <div class="space-y-3">
          <div>
            <label for="iconName" class="block text-sm text-gray-400 mb-1">アイコン名 (ID)</label>
            <input type="text" id="iconName" placeholder="例: icon-home"
              class="w-full bg-zinc-700 border border-zinc-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-400"
              aria-label="アイコン名・IDを入力">
          </div>
          <div>
            <label for="iconViewBox" class="block text-sm text-gray-400 mb-1">viewBox</label>
            <input type="text" id="iconViewBox" value="0 0 24 24"
              class="w-full bg-zinc-700 border border-zinc-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-400"
              aria-label="viewBoxを入力">
          </div>
          <div>
            <label for="iconColor" class="block text-sm text-gray-400 mb-1">カラー (fill)</label>
            <div class="flex gap-2">
              <input type="color" id="iconColorPicker" value="#38bdf8"
                class="h-10 w-16 bg-zinc-700 border border-zinc-600 rounded-lg cursor-pointer"
                aria-label="アイコンカラーを選択">
              <input type="text" id="iconColor" value="#38bdf8"
                class="flex-1 bg-zinc-700 border border-zinc-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-400"
                aria-label="カラー値をテキストで入力">
            </div>
          </div>
          <div>
            <label for="iconPath" class="block text-sm text-gray-400 mb-1">SVGパス (d属性)</label>
            <textarea id="iconPath" rows="4" placeholder="例: M12 2L2 7l10 5 10-5-10-5zm0 7L2 14l10 5 10-5-10-5z"
              class="w-full bg-zinc-700 border border-zinc-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-400 font-mono text-xs resize-none"
              aria-label="SVGパスのd属性を入力"></textarea>
          </div>
          <button id="addIconBtn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-sky-400" role="button">
            アイコンを追加
          </button>
        </div>

        <!-- サンプルボタン -->
        <div class="mt-4">
          <p class="text-xs text-gray-400 mb-2">サンプルを試す:</p>
          <div class="flex flex-wrap gap-2">
            <button class="sample-btn text-xs bg-zinc-700 hover:bg-zinc-600 px-3 py-1 rounded-lg" data-name="icon-home" data-vb="0 0 24 24" data-path="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" data-color="#38bdf8">Home</button>
            <button class="sample-btn text-xs bg-zinc-700 hover:bg-zinc-600 px-3 py-1 rounded-lg" data-name="icon-star" data-vb="0 0 24 24" data-path="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" data-color="#fbbf24">Star</button>
            <button class="sample-btn text-xs bg-zinc-700 hover:bg-zinc-600 px-3 py-1 rounded-lg" data-name="icon-heart" data-vb="0 0 24 24" data-path="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" data-color="#f43f5e">Heart</button>
            <button class="sample-btn text-xs bg-zinc-700 hover:bg-zinc-600 px-3 py-1 rounded-lg" data-name="icon-check" data-vb="0 0 24 24" data-path="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" data-color="#4ade80">Check</button>
          </div>
        </div>
      </div>

      <!-- プレビュー -->
      <div class="bg-zinc-800 rounded-xl p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-semibold text-sky-300">アイコン一覧</h2>
          <span id="iconCount" class="text-xs text-gray-400">0件</span>
        </div>
        <div id="iconPreviewGrid" class="grid grid-cols-4 gap-3 mb-4 min-h-32">
          <p id="noIcons" class="col-span-4 text-gray-500 text-sm text-center py-8">アイコンがありません</p>
        </div>
      </div>
    </div>

    <!-- スプライトシート出力 -->
    <div class="mt-6 bg-zinc-800 rounded-xl p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-sky-300">スプライトシート</h2>
        <button id="copySpriteBtn" class="bg-sky-700 hover:bg-sky-600 text-white text-sm px-4 py-2 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-sky-400" role="button">
          全コピー
        </button>
      </div>
      <pre id="spriteOutput" class="bg-zinc-900 rounded-lg p-4 text-xs font-mono text-green-300 overflow-x-auto whitespace-pre max-h-64 overflow-y-auto" aria-label="生成されたSVGスプライトシート"></pre>
    </div>

    <!-- useスニペット -->
    <div id="snippetSection" class="mt-6 bg-zinc-800 rounded-xl p-6">
      <h2 class="text-lg font-semibold mb-4 text-sky-300">use 要素スニペット</h2>
      <p class="text-xs text-gray-400 mb-3">クリックでコピー</p>
      <div id="snippetList" class="space-y-2"></div>
      <p id="noSnippets" class="text-gray-500 text-sm text-center py-4">アイコンを追加するとスニペットが表示されます</p>
    </div>

    <!-- 非表示SVGスプライト -->
    <svg id="spriteSvg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;"></svg>
  </div>

  <script>
    const STORAGE_KEY = 'svg_symbol_icons';
    const SIZES = [16, 24, 32, 48];

    function loadIcons() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
    }
    function saveIcons(icons) { localStorage.setItem(STORAGE_KEY, JSON.stringify(icons)); }

    function buildSprite(icons) {
      if (icons.length === 0) return '<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n</svg>';
      const symbols = icons.map(ic => {
        const escaped = ic.path.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        return `  <symbol id="${ic.name}" viewBox="${ic.viewBox}">\n    <path fill="${ic.color}" d="${escaped}"/>\n  </symbol>`;
      }).join('\n');
      return `<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n${symbols}\n</svg>`;
    }

    function updateSpriteSvg(icons) {
      const svg = document.getElementById('spriteSvg');
      svg.textContent = '';
      icons.forEach(ic => {
        const sym = document.createElementNS('http://www.w3.org/2000/svg', 'symbol');
        sym.setAttribute('id', ic.name);
        sym.setAttribute('viewBox', ic.viewBox);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('fill', ic.color);
        path.setAttribute('d', ic.path);
        sym.appendChild(path);
        svg.appendChild(sym);
      });
    }

    function render() {
      const icons = loadIcons();
      const grid = document.getElementById('iconPreviewGrid');
      const noIcons = document.getElementById('noIcons');
      const spriteOutput = document.getElementById('spriteOutput');
      const snippetList = document.getElementById('snippetList');
      const noSnippets = document.getElementById('noSnippets');

      document.getElementById('iconCount').textContent = icons.length + '件';
      grid.textContent = '';
      snippetList.textContent = '';

      updateSpriteSvg(icons);
      spriteOutput.textContent = buildSprite(icons);

      if (icons.length === 0) {
        grid.appendChild(noIcons);
        noSnippets.classList.remove('hidden');
        return;
      }
      noSnippets.classList.add('hidden');

      icons.forEach((ic, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-zinc-700 rounded-lg p-2 text-center relative group';
        card.setAttribute('role', 'listitem');

        // プレビューSVG (24px)
        const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svgEl.setAttribute('width', '32');
        svgEl.setAttribute('height', '32');
        svgEl.setAttribute('viewBox', ic.viewBox);
        svgEl.setAttribute('aria-label', ic.name);
        svgEl.className = 'mx-auto mb-1';
        const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        pathEl.setAttribute('fill', ic.color);
        pathEl.setAttribute('d', ic.path);
        svgEl.appendChild(pathEl);
        card.appendChild(svgEl);

        const nameDiv = document.createElement('div');
        nameDiv.className = 'text-xs text-gray-300 truncate';
        nameDiv.textContent = ic.name;
        card.appendChild(nameDiv);

        // 削除ボタン
        const delBtn = document.createElement('button');
        delBtn.className = 'absolute top-1 right-1 hidden group-hover:block text-red-400 hover:text-red-300 text-xs leading-none';
        delBtn.textContent = '×';
        delBtn.setAttribute('aria-label', ic.name + 'を削除');
        delBtn.addEventListener('click', () => {
          const all = loadIcons();
          all.splice(idx, 1);
          saveIcons(all);
          render();
        });
        card.appendChild(delBtn);
        grid.appendChild(card);

        // スニペット
        const snippet = document.createElement('div');
        snippet.className = 'bg-zinc-900 rounded-lg p-3 cursor-pointer hover:bg-zinc-700 transition-colors';
        snippet.setAttribute('tabindex', '0');
        snippet.setAttribute('role', 'button');
        snippet.setAttribute('aria-label', ic.name + 'のスニペットをコピー');

        const snLabel = document.createElement('div');
        snLabel.className = 'text-xs text-sky-300 mb-1 font-semibold';
        snLabel.textContent = ic.name + ' — サイズ別 use 要素';
        snippet.appendChild(snLabel);

        SIZES.forEach(sz => {
          const code = document.createElement('div');
          code.className = 'text-xs font-mono text-green-300';
          code.textContent = `<svg width="${sz}" height="${sz}" aria-hidden="true"><use href="#${ic.name}"/></svg>`;
          snippet.appendChild(code);
        });

        snippet.addEventListener('click', () => {
          const lines = SIZES.map(sz => `<svg width="${sz}" height="${sz}" aria-hidden="true"><use href="#${ic.name}"/></svg>`).join('\n');
          navigator.clipboard.writeText(lines).then(() => {
            const orig = snLabel.textContent;
            snLabel.textContent = 'コピーしました！';
            setTimeout(() => { snLabel.textContent = orig; }, 1200);
          });
        });
        snippet.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') snippet.click(); });
        snippetList.appendChild(snippet);
      });
    }

    document.getElementById('addIconBtn').addEventListener('click', () => {
      const name = document.getElementById('iconName').value.trim();
      const viewBox = document.getElementById('iconViewBox').value.trim();
      const color = document.getElementById('iconColor').value.trim();
      const path = document.getElementById('iconPath').value.trim();

      if (!name) { alert('アイコン名を入力してください'); return; }
      if (!path) { alert('SVGパスを入力してください'); return; }
      if (!/^[\w-]+$/.test(name)) { alert('アイコン名は英数字・ハイフン・アンダースコアのみ使用できます'); return; }

      const icons = loadIcons();
      if (icons.some(ic => ic.name === name)) { alert('同名のアイコンが既に存在します'); return; }
      icons.push({ name, viewBox, color, path });
      saveIcons(icons);
      render();

      document.getElementById('iconName').value = '';
      document.getElementById('iconPath').value = '';
    });

    document.getElementById('copySpriteBtn').addEventListener('click', () => {
      const icons = loadIcons();
      navigator.clipboard.writeText(buildSprite(icons)).then(() => {
        const btn = document.getElementById('copySpriteBtn');
        btn.textContent = 'コピーしました！';
        setTimeout(() => { btn.textContent = '全コピー'; }, 1500);
      });
    });

    document.getElementById('iconColorPicker').addEventListener('input', e => {
      document.getElementById('iconColor').value = e.target.value;
    });
    document.getElementById('iconColor').addEventListener('input', e => {
      document.getElementById('iconColorPicker').value = e.target.value;
    });

    document.querySelectorAll('.sample-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('iconName').value = btn.dataset.name;
        document.getElementById('iconViewBox').value = btn.dataset.vb;
        document.getElementById('iconPath').value = btn.dataset.path;
        document.getElementById('iconColor').value = btn.dataset.color;
        document.getElementById('iconColorPicker').value = btn.dataset.color;
      });
    });

    render();
  </script>
</body>
</html>
